<!DOCTYPE html>
<html>
    <head>
        <title>Subscription Pricing</title>
        <style>
            body{
                font-family:Arial;
                text-align: center;
                background-color:#f4f4f4;
            }

            .pricing-container{
                display:flex;
                justify-content: center;
                gap:20px;
                margin-top:40px;
            }

            .card{
                background:white;
                padding:20px;
                width:220px;
                border-radius:10px;
                box-shadow:0 4px 10px rgba(0,0,0,0.2);
            }

            .price{
                font-size:24px;
                font-weight:bold;
            }
            .pro{
                transform:scale(1.1);
                background-color: aquamarine;
                box-shadow:0 6px 15px rgba(0,0,0,0.3);
            }

            button{
                padding:10px 20px;
                background-color: yellowgreen;
                color:white;
                border:none;
                border-radius:5px;
                cursor:pointer;
                transition:0.3s;
            }

            button:hover{
                background-color:violet;
            }
        </style>
    </head>

    <body>
        <h1>Subscription Pricing & hello radhika</h1>
        <div class="pricing-container">
            <div class="card">
                <h2>Basic</h2>
                <p class="price">$10/month</p>
                <ul>
                    <li>10GB Storage</li>
                    <li>Email Support</li>
                    <li>Basic Analytics</li>
                </ul>
                <button>Subscribe</button>
            </div>
            <div class="card pro">
                <h2>Pro</h2>
                <p class="price">$20/month</p>
                <ul>
                    <li>50GB Storage</li>
                    <li>Priority Suport</li>
                    <li>Advanced Analytics</li>
                </ul>
                <button>Subscribe</button>
            </div>
            <div class="card">
                <h2>Enterprice</h2>
                <p class="price">$40/month</p>
                <ul>
                    <li>Unlimited Storage</li>
                    <li>24/7 Support</li>
                    <li>Custom Analytics</li>
                </ul>
                <button>Subscribe</button>
            </div>
        </div>
    </body>
</html>
